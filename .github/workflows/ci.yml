name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lcb-node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Both runtimes compare against the same committed bytes; the main job checks Node 24.
      - name: Check exported data on Node 22
        run: npm run check-lcb-data

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dependencies

      - name: Generate data from markdown
        run: npm run generate-data

      - name: Check charity-adjusted wealth data
        run: npm run check-lcb-data

      - name: Lint
        run: npm run lint

      - name: Check .agents/skills mirror is in sync with .claude/skills
        run: |
          npm run sync-skills -- --check || {
            echo "::error::.agents/skills is out of sync with .claude/skills. Move intended edits to .claude/skills, run 'npm run sync-skills', and commit the generated .agents/skills mirror."
            exit 1
          }

      - name: Unit and integration tests (gated on coverage thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build
